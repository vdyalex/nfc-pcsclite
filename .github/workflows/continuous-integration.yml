name: Continous Integration

on: [push, pull_request]

jobs:

  Build:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install lib dependencies
        run: yarn --cwd ./lib install --verbose

      - run: objdump -t lib\build\Release\pcsclite.node | grep Init
        if: matrix.os == 'windows-latest'
        continue-on-error: true

      - run: node -p "process.versions.modules"
        if: matrix.os == 'windows-latest'
        continue-on-error: true

      - run: objdump -t pcsclite.node | findstr version
        if: matrix.os == 'windows-latest'
        continue-on-error: true

      - run: node -e "console.log(require('./lib/build/Release/pcsclite.node'))"
        if: matrix.os == 'windows-latest'
        continue-on-error: true

      - name: Run lib tests
        run: yarn --cwd ./lib test

      - name: Build lib
        run: yarn --cwd ./lib build

      - name: Install package dependencies
        run: yarn install --verbose

      - name: Run package tests
        run: yarn test

      - name: Build package
        run: yarn build
