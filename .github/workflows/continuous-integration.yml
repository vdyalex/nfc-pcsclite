name: Continous Integration

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  Build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22, 24, 25]
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: MacOS
          - os: windows-latest
            name: Windows

    name: Node ${{ matrix.node-version }} on ${{ matrix.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Node (v${{ matrix.node-version }})
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y build-essential python3 libpcsclite1 libpcsclite-dev pcscd

      # Automatically runs `node-gyp rebuild``
      # https://docs.npmjs.com/cli/v7/configuring-npm/package-json#default-values
      # If there is a binding.gyp file in the root of your package and you have
      # not defined an install or preinstall script, npm will default the install
      # command to compile using node-gyp.
      - name: Install dependencies
        run: yarn install

      # Currently running tests only on MacOS
      - name: Run tests
        if: matrix.os == 'macos-latest'
        run: yarn test

      - name: Compile code
        run: yarn compile
