name: Continous Integration

on: [push, pull_request]

jobs:

  Build:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y build-essential python3

      - name: Install pcsclite on Linux
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libpcsclite1 libpcsclite-dev pcscd

      - name: Enable Smart Card services
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Starting core Smart Card services..."

          # Smart Card Resource Manager
          Set-Service -Name SCardSvr -StartupType Automatic
          Start-Service -Name SCardSvr

          # Smart Card Device Enumeration
          Set-Service -Name ScDeviceEnum -StartupType Automatic
          Start-Service -Name ScDeviceEnum

          # Confirm status
          Get-Service SCardSvr, ScDeviceEnum | Select Name, Status, StartType | Format-Table -AutoSize

      - name: Verify Smart Card availability
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Listing Smart Card devices..."
          Get-PnpDevice | Where-Object { $_.FriendlyName -like "*smart*" -or $_.Class -eq "SmartCardReader" }

      - name: Install lib dependencies
        run: yarn --cwd ./lib install --verbose

      - name: Run lib tests
        run: yarn --cwd ./lib test

      - name: Build lib
        run: yarn --cwd ./lib build

      - name: Install package dependencies
        run: yarn install --verbose

      - name: Run package tests
        run: yarn test

      - name: Build package
        run: yarn build
